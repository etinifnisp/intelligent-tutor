<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Intelligent Tutor Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .dashboard-container { display: flex; height: 100vh; }
        .left-panel { width: 40%; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .right-panel { width: 60%; display: flex; flex-direction: column; background-color: #141414; box-sizing: border-box; }
        .select-input { padding: 10px; background-color: #1e1e1e; color: #fff; border: 1px solid #3d3d3d; border-radius: 4px; width: 100%; margin-bottom: 15px; }
        .question-list { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .question-card { padding: 12px; margin-bottom: 10px; background-color: #1e1e1e; border: 1px solid #3d3d3d; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .question-card.selected { background-color: #1a237e; border-color: #304ffe; }
        .chat-banner { background-color: #1e1e1e; padding: 15px; border-bottom: 1px solid #2d2d2d; font-size: 14px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        .message.user { align-self: flex-end; background-color: #0d47a1; color: white; }
        .message.model { align-self: flex-start; background-color: #1e1e1e; border: 1px solid #2d2d2d; }
        .input-form { padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2d2d2d; background-color: #111; }
        .text-input { flex: 1; padding: 14px; background-color: #1e1e1e; color: #fff; border: 1px solid #3d3d3d; border-radius: 6px; font-size: 15px; outline: none; }
        .submit-btn { padding: 14px 28px; background-color: #1976d2; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; }
        .page-btn { padding: 8px 16px; cursor: pointer; background-color: #333; color: #fff; border: none; border-radius: 4px; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [questions, setQuestions] = useState([]);
            const [page, setPage] = useState(1);
            const [totalMatches, setTotalMatches] = useState(0);
            const [selectedQuestion, setSelectedQuestion] = useState(null);
            const [subject, setSubject] = useState('');
            const [messages, setMessages] = useState([
                { role: 'model', content: 'Namaste! Select a question from the browser or type any JEE concept query to begin.' }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('');
            const [sessionId] = useState(`session_${Math.random().toString(36).substr(2, 9)}`);
            
            const ws = useRef(null);
            const chatEndRef = useRef(null);

            useEffect(() => {
                fetch(`http://127.0.0.1:8000/questions?page=${page}&limit=5${subject ? `&subject=${subject}` : ''}`)
                    .then(res => res.json())
                    .then(data => {
                        setQuestions(data.questions);
                        setTotalMatches(data.total_matches);
                    })
                    .catch(err => console.error("API error:", err));
            }, [page, subject]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const sendMessage = (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const studentMsg = input;
                setMessages(prev => [...prev, { role: 'user', content: studentMsg }]);
                setInput('');
                setStatus('Routing through decision gate...');

                ws.current = new WebSocket('ws://127.0.0.1:8000/tutor/chat');

                ws.current.onopen = () => {
                    const payload = {
                        session_id: sessionId,
                        student_message: studentMsg,
                        question_id: selectedQuestion ? `q_${selectedQuestion.question_number}` : null,
                        chat_history: messages.map(m => ({ role: m.role, content: m.content }))
                    };
                    ws.current.send(JSON.stringify(payload));
                };

                ws.current.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') {
                        setStatus(data.message);
                    } else if (data.type === 'token') {
                        setStatus('');
                        setMessages(prev => {
                            const lastMsg = prev[prev.length - 1];
                            if (lastMsg && lastMsg.role === 'model') {
                                return [...prev.slice(0, -1), { ...lastMsg, content: lastMsg.content + data.text }];
                            } else {
                                return [...prev, { role: 'model', content: data.text }];
                            }
                        });
                    } else if (data.type === 'done') {
                        ws.current.close();
                    }
                };
            };

            return (
                <div className="dashboard-container">
                    <div className="left-panel">
                        <h2 style={{color: '#64b5f6', marginTop: 0}}>📚 JEE Question Bank ({totalMatches})</h2>
                        <select className="select-input" value={subject} onChange={e => { setSubject(e.target.value); setPage(1); }}>
                            <option value="">All Subjects</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Mathematics">Mathematics</option>
                        </select>
                        <div className="question-list">
                            {questions.map((q, idx) => (
                                <div key={idx} className={`question-card ${selectedQuestion?.question_number === q.question_number ? 'selected' : ''}`} onClick={() => setSelectedQuestion(q)}>
                                    <div style={{display:'flex', justifyContent:'space-between', fontSize:'12px', color:'#90caf9', marginBottom:'5px'}}>
                                        <span>{q.chapter}</span>
                                        <span style={{backgroundColor:'#2e7d32', padding:'2px 6px', borderRadius:'3px', color:'#fff'}}>{q.difficulty}</span>
                                    </div>
                                    <p style={{margin:0, fontSize:'14px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{q.raw_text}</p>
                                </div>
                            ))}
                        </div>
                        <div className="pagination-bar">
                            <button className="page-btn" disabled={page === 1} onClick={() => setPage(p => p - 1)}>Previous</button>
                            <span>Page {page}</span>
                            <button className="page-btn" disabled={questions.length < 5} onClick={() => setPage(p => p + 1)}>Next</button>
                        </div>
                    </div>

                    <div className="right-panel">
                        {selectedQuestion && (
                            <div className="chat-banner">
                                <span style={{color:'#ffb74d', fontWeight:'bold'}}>🎯 Target Question Context:</span>
                                <div style={{marginTop:'5px', fontSize:'13px', backgroundColor:'#121212', padding:'8px', borderRadius:'4px', maxHeight:'60px', overflowY:'auto'}}>
                                    {selectedQuestion.raw_text}
                                </div>
                            </div>
                        )}
                        <div className="chat-messages">
                            {messages.map((m, idx) => (
                                <div key={idx} className={`message ${m.role}`}>{m.content}</div>
                            ))}
                            {status && <div style={{fontSize:'13px', color:'#aaa', fontStyle:'italic'}}>⚡ {status}</div>}
                            <div ref={chatEndRef} />
                        </div>
                        <form className="input-form" onSubmit={sendMessage}>
                            <input className="text-input" type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Ask for a hint or conceptual explanation..." />
                            <button className="submit-btn" type="submit">Ask Tutor</button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
